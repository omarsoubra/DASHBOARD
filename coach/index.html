<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#15161c; --ink2:#4a4d5a; --mute:#7a7e8c; --line:#e3e5ea; --accent:#15161c; --good:#00845b; --warn:#b7790f; --bad:#d0423b; --soft:#eef0f3;
    --side-w:232px; --side-bg:#0c0d13; --side-line:#1c1d29; --side-text:#c4c6d4; --side-muted:#6b6d85; --brand:#00e5a0; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 'Inter', system-ui, -apple-system, sans-serif; -webkit-text-size-adjust:100%; }
  .side { position:fixed; top:0; left:0; bottom:0; width:var(--side-w); z-index:90; background:var(--side-bg); border-right:1px solid var(--side-line); display:flex; flex-direction:column; padding:16px 12px; gap:2px; color:var(--side-text); overflow-y:auto; transition:transform .2s ease; }
  .side-head { padding:4px 8px 20px; min-height:40px; display:flex; flex-direction:column; line-height:1; }
  .side-head b { font-family:'Bebas Neue', sans-serif; font-weight:400; font-size:24px; letter-spacing:.04em; color:#f2f3f7; display:flex; align-items:center; gap:8px; }
  .side-head small { font-family:'DM Mono', monospace; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--side-muted); margin-top:4px; }
  .side img.logo { width:26px; height:26px; border-radius:6px; object-fit:cover; }
  .side .grp { font-family:'DM Mono', monospace; font-size:10px; letter-spacing:.14em; color:var(--side-muted); padding:16px 12px 8px; }
  .side a.nv { display:flex; align-items:center; gap:12px; height:40px; padding:0 12px; border-radius:8px; color:var(--side-text); text-decoration:none; font-size:14px; font-weight:500; white-space:nowrap; position:relative; }
  .side a.nv svg { width:18px; height:18px; flex:0 0 18px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .side a.nv:hover { background:#151621; color:#fff; }
  .side a.nv[aria-current="page"] { background:#161a1d; color:#fff; }
  .side a.nv[aria-current="page"]::before { content:''; position:absolute; left:0; top:10px; bottom:10px; width:3px; border-radius:2px; background:var(--brand); }
  .side a.nv[aria-current="page"] svg { color:var(--brand); }
  .side a.nv:focus-visible, .side .out:focus-visible, .topbar button:focus-visible { outline:2px solid #fff; outline-offset:-2px; }
  .side-foot { margin-top:auto; border-top:1px solid var(--side-line); padding:12px 4px 0; }
  .side .out { display:flex; align-items:center; width:100%; height:36px; padding:0 8px; border-radius:8px; background:transparent; border:0; color:var(--side-text); font:500 13px 'Inter', system-ui, sans-serif; min-height:0; text-align:left; }
  .side .out:hover { background:#151621; color:#fff; }
  .topbar { display:none; }
  .backdrop { display:none; }
  main { margin-left:var(--side-w); max-width:1100px; padding:32px 32px 80px; }
  body.bare .side, body.bare .topbar { display:none; } body.bare main { margin:0 auto; max-width:520px; padding:32px 16px; }
  @media (max-width:767px) {
    .side { width:264px; transform:translateX(-100%); z-index:96; }
    body.drawer .side { transform:translateX(0); box-shadow:0 0 40px rgba(0,0,0,.35); }
    .backdrop { display:block; position:fixed; inset:0; background:rgba(10,11,16,.45); z-index:95; opacity:0; pointer-events:none; transition:opacity .2s; }
    body.drawer .backdrop { opacity:1; pointer-events:auto; }
    .topbar { display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:80; height:56px; padding:0 16px; background:var(--side-bg); color:#fff; }
    .topbar b { font-family:'Bebas Neue', sans-serif; font-weight:400; font-size:20px; letter-spacing:.04em; }
    .topbar span { margin-left:auto; font-size:13px; color:var(--side-text); font-weight:500; }
    .topbar button { background:transparent; border:1px solid #262838; color:#fff; width:36px; height:36px; min-height:36px; padding:0; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; }
    .topbar svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; }
    main { margin-left:0; padding:16px 16px 80px; }
  }
  @media (prefers-reduced-motion: reduce) { .side, .backdrop { transition:none; } }
  h1 { font:600 24px/1.2 'Inter', system-ui, sans-serif; letter-spacing:-0.01em; margin:0 0 20px; }
  h2 { font:600 14px/1.3 'Inter', system-ui, sans-serif; margin:28px 4px 10px; color:var(--ink); }
  h3 { font-size:16px; margin:0 0 6px; }
  p { margin:0 0 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:12px; box-shadow:0 1px 2px rgba(20,22,30,.03); }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .grow { flex:1 1 auto; min-width:0; }
  .mute { color:var(--mute); } .small { font-size:14px; } .right { text-align:right; }
  button, .btn { font:inherit; font-weight:600; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:10px; padding:11px 16px; cursor:pointer; min-height:44px; }
  button.ghost { background:transparent; color:var(--ink); border-color:var(--line); }
  button.danger { background:transparent; color:var(--bad); border-color:var(--line); }
  button.link { background:none; border:0; color:var(--ink); text-decoration:underline; padding:6px 0; min-height:0; font-weight:500; }
  button:disabled { opacity:.5; cursor:default; }
  label { display:block; font-size:14px; font-weight:600; margin:0 0 5px; }
  .hint { font-weight:400; color:var(--mute); }
  input, select { font:inherit; width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); min-height:44px; }
  input:focus, select:focus, button:focus-visible { outline:2px solid var(--ink); outline-offset:1px; }
  .grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:14px; }
  .grid .full { grid-column:1 / -1; }
  @media (max-width:560px) { .grid { grid-template-columns:1fr; } }
  .err { color:var(--bad); font-size:14px; margin-top:4px; }
  .banner { border-radius:10px; padding:12px 14px; margin-bottom:12px; font-size:15px; }
  .banner.bad { background:#fdecea; color:#7a1c16; } .banner.good { background:#e8f5ee; color:#14532d; } .banner.info { background:var(--soft); }
  .pill { display:inline-block; font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:3px 9px; border-radius:99px; background:var(--soft); color:var(--mute); white-space:nowrap; }
  .pill.good { background:#e8f5ee; color:var(--good); } .pill.warn { background:#fff3dd; color:var(--warn); } .pill.bad { background:#fdecea; color:var(--bad); }
  .item { display:flex; gap:12px; align-items:center; padding:14px 0; border-top:1px solid var(--line); cursor:pointer; background:none; border-left:0; border-right:0; border-bottom:0; width:100%; text-align:left; color:inherit; border-radius:0; font-weight:400; min-height:0; }
  .item:first-child { border-top:0; }
  .item .name { font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:15px; }
  th, td { text-align:left; padding:8px 6px; border-top:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--mute); font-weight:600; border-top:0; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 12px; }
  .tabs button { background:var(--soft); color:var(--ink); border-color:var(--soft); padding:8px 13px; min-height:38px; font-weight:600; font-size:14px; }
  .tabs button[aria-pressed="true"] { background:var(--accent); color:#fff; border-color:var(--accent); }
  .meal { padding:10px 0; border-top:1px solid var(--line); } .meal:first-child { border-top:0; }
  .linkbox { font-family:ui-monospace, Menlo, monospace; font-size:13px; word-break:break-all; background:var(--soft); border-radius:8px; padding:10px; margin:8px 0; }
  .spin { display:inline-block; width:16px; height:16px; border:2px solid var(--line); border-top-color:var(--ink); border-radius:50%; animation:sp 0.8s linear infinite; vertical-align:-3px; margin-right:8px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation:none; } }
  svg.chart { width:100%; height:120px; display:block; }
  button, .btn { color:var(--on-accent, #fff); }
  .tabs button[aria-pressed="true"] { color:var(--on-accent, #fff); }
  .edit { display:grid; gap:8px; }
  .erow { display:grid; grid-template-columns:minmax(0,1fr) 64px 84px 40px; gap:6px; align-items:center; }
  .frow { display:grid; grid-template-columns:minmax(0,1fr) 92px 44px 40px; gap:6px; align-items:center; }
  .erow input, .erow select, .frow input { padding:9px 8px; min-height:42px; }
  .ex { padding-bottom:10px; margin-bottom:10px; border-bottom:1px solid var(--line); } .ex:last-child { border-bottom:0; }
  .erow2 { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:6px; } .erow2 input, .erow2 select:nth-of-type(3) { grid-column:1 / -1; } .erow2 select, .erow2 input { padding:9px 8px; min-height:42px; font-size:14px; }
  .ehead { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--mute); font-weight:600; }
  button.x { background:none; border:1px solid var(--line); color:var(--mute); padding:0; width:40px; min-height:42px; font-size:18px; line-height:1; }
  button.mini { padding:6px 12px; min-height:36px; font-size:14px; background:transparent; color:var(--ink); border-color:var(--line); }
  textarea { font:inherit; width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; min-height:96px; resize:vertical; }
  .bar { position:sticky; bottom:12px; z-index:4; background:var(--ink); color:#fff; border-radius:12px; padding:12px 14px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; box-shadow:0 6px 24px rgba(0,0,0,.18); margin-top:14px; }
  .bar button { background:#fff; color:var(--ink); border-color:#fff; } .bar button.ghost { background:transparent; color:#fff; border-color:rgba(255,255,255,.4); }
  .changed { border-color:var(--warn); }
  .swatches { display:flex; flex-wrap:wrap; gap:10px; } .swatches button { width:44px; height:44px; min-height:44px; padding:0; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 1px var(--line); }
  .swatches button[aria-pressed="true"] { box-shadow:0 0 0 3px var(--ink); }
  .phone { width:250px; border:8px solid #16161a; border-radius:30px; background:#faf9f6; overflow:hidden; margin:0 auto; font-size:13px; }
  .phone .top { display:flex; align-items:center; gap:8px; padding:12px; background:#fff; border-bottom:1px solid #e8e3db; font-weight:700; letter-spacing:.05em; text-transform:uppercase; font-size:12px; }
  .phone .top img { width:24px; height:24px; border-radius:6px; }
  .phone .body { padding:12px; display:grid; gap:10px; }
  .phone .pc { background:#fff; border:1px solid #e8e3db; border-radius:12px; padding:10px; }
  .phone .pb { border-radius:99px; padding:9px 12px; text-align:center; font-weight:700; color:#fff; }
  .phone .bar2 { height:8px; border-radius:99px; background:#efece6; overflow:hidden; } .phone .bar2 i { display:block; height:100%; width:62%; }
  .two { display:grid; grid-template-columns:minmax(0,1fr) 280px; gap:18px; align-items:start; } @media (max-width:720px) { .two { grid-template-columns:1fr; } .erow { grid-template-columns:1fr 1fr 40px; } .ex .erow > input:first-child { grid-column:1 / -1; } .erow.ehead, .frow.ehead { display:none; } .frow { grid-template-columns:1fr 44px 40px; } .frow > input:first-child { grid-column:1 / -1; } }
  .checks { display:flex; flex-wrap:wrap; gap:8px; } .checks label { display:flex; align-items:center; gap:6px; font-weight:400; margin:0; border:1px solid var(--line); border-radius:99px; padding:7px 12px; background:#fff; }
  .checks input { width:auto; min-height:0; }
  .foodprefs { border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:#fff; } .foodprefs summary { cursor:pointer; font-weight:600; } .foodprefs[open] summary { margin-bottom:12px; }
</style>
</head>
<body class="bare">
<div class="topbar"><button type="button" id="menu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><b id="brand2">Coach</b><span id="where"></span></div>
<aside class="side" id="side"><div class="side-head"><b><img class="logo" id="logo" alt="" hidden><span id="brand">Coach</span></b><small>Coach dashboard</small></div><nav id="nav" aria-label="Sections"></nav><div class="side-foot" id="who"></div></aside>
<div class="backdrop" id="backdrop"></div>
<main id="app" aria-live="polite"></main>
<script>
(function () {
  'use strict';
  var LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  var API = LOCAL ? '/api' : 'https://cwrrxieahrcustjvpqsk.supabase.co/functions/v1/api';
  var KEY = 'cp_session_v1';
  var DASH = '../dashboard.html';                      // the coach dashboard (the daily screen); this app is its plan builder
  var S = { session: null, coach: null, options: null, timer: null };
  try { S.session = localStorage.getItem(KEY); } catch (e) {}

  // ── tiny DOM helpers: every piece of text goes through textContent ──────
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    });
    (function add(c) {
      if (c == null || c === false) return;
      if (Array.isArray(c)) { c.forEach(add); return; }
      n.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
    })(kids);
    return n;
  }
  var app = document.getElementById('app');
  function show(nodes) { stopTimer(); app.replaceChildren.apply(app, Array.isArray(nodes) ? nodes.filter(Boolean) : [nodes]); window.scrollTo(0, 0); }
  function stopTimer() { if (S.timer) { clearTimeout(S.timer); S.timer = null; } }
  function banner(kind, text) { return el('div', { class: 'banner ' + kind, role: kind === 'bad' ? 'alert' : 'status', text: text }); }
  function oops(e) {
    if (e && e.message === 'signed_out') return;
    if (window.console) console.error(e);
    show(banner('bad', e instanceof TypeError && /fetch|network|load/i.test(String(e.message)) ? 'Could not reach the server. Check your connection.' : 'Something went wrong on this screen. Reload the page and try again.'));
  }
  function busy(text) { return el('p', { class: 'mute' }, [el('span', { class: 'spin' }), text]); }

  function call(type, body) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ type: type, session: S.session }, body || {})) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.ok === false && j.error === 'unauthorized' && type !== 'cpLogin') { signOut(true); throw new Error('signed_out'); }
        return j;
      });
  }
  var MSG = {
    bad_login: 'That email and password do not match.', locked: 'Too many tries. Wait 15 minutes and try again.', suspended: 'This account is paused. Contact support.',
    link_invalid: 'This setup link has expired or was already used. Ask for a new one.', password_too_short: 'Use at least 10 characters.',
    password_too_weak: 'Choose a stronger password.', password_too_long: 'That password is too long.', bad_form: 'Check the client\'s name: letters only.',
    client_exists: 'You already have a client with this name. Add a last name, or update their plan from their page.',
    client_limit: 'You have reached your client limit. Contact support to raise it.', too_many_open_builds: 'Three plans are already being built. Finish or discard one first.',
    build_in_progress: 'A plan for this client is already being built.', not_ready: 'This plan is not ready to publish yet.', write_failed: 'Could not save. Try again.',
    unknown_client: 'Client not found.', unknown_form: 'That form is no longer there.', bad_update: 'Check the note to your client.', unknown_build: 'Plan not found.'
  };
  function say(j) { return (j && (j.detail || MSG[j.error])) || 'Something went wrong. Try again.'; }
  function when(iso) {
    if (!iso) return 'never';
    var d = Math.floor((Date.now() - Date.parse(iso)) / 86400000);
    return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d < 14 ? d + ' days ago' : new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
  }
  function lum(hex) { var c = [1, 3, 5].map(function (i) { var v = parseInt(hex.substr(i, 2), 16) / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; }
  function applyTheme(accent) {
    var a = /^#[0-9a-f]{6}$/i.test(accent || '') ? accent : '#00e5a0';
    document.documentElement.style.setProperty('--brand', a);
  }
  var ICON = {
    'switch': '<path d="M4 8h13"/><path d="M13 4l4 4-4 4"/><path d="M20 16H7"/><path d="M11 12l-4 4 4 4"/>',
    today: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
    clients: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.8a3.5 3.5 0 010 6.4"/><path d="M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/>',
    checkins: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 13l2 2 4-4"/>',
    activity: '<path d="M3 12h4l3-8 4 16 3-8h4"/>',
    'new': '<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
    plans: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>',
    templates: '<rect x="3" y="4" width="8" height="7" rx="1.5"/><rect x="13" y="4" width="8" height="7" rx="1.5"/><rect x="3" y="13" width="8" height="7" rx="1.5"/><rect x="13" y="13" width="8" height="7" rx="1.5"/>',
    look: '<circle cx="12" cy="12" r="9"/><circle cx="8.5" cy="10" r="1.2"/><circle cx="12" cy="7.5" r="1.2"/><circle cx="15.5" cy="10" r="1.2"/><path d="M12 21a3 3 0 010-6h2a3 3 0 003-3"/>'
  };
  function icon(name) {   // fixed drawings from the table above, never text from the server
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.setAttribute('viewBox', '0 0 24 24'); svg.setAttribute('aria-hidden', 'true');
    svg.innerHTML = ICON[name] || ''; return svg;
  }
  function setHeader(section) {
    var brand = S.coach ? S.coach.brand : 'Coach';
    document.getElementById('brand').textContent = brand; document.getElementById('brand2').textContent = brand;
    document.title = S.coach ? S.coach.brand + ' - Plans' : 'Coach';
    applyTheme(S.coach && S.coach.accent);
    var logo = document.getElementById('logo');
    if (S.coach && S.coach.logo) { logo.src = 'data:image/png;base64,' + S.coach.logo; logo.hidden = false; } else { logo.hidden = true; logo.removeAttribute('src'); }
    var nav = document.getElementById('nav'); nav.replaceChildren();
    var who = document.getElementById('who'); who.replaceChildren();
    document.body.classList.toggle('bare', !S.coach); document.body.classList.remove('drawer');
    if (!S.coach) return;
    if (section) S.section = section;
    var NAMES = { 'new': 'New client', clients: 'Plans and forms', templates: 'Templates', look: 'Your look', 'switch': 'Bring clients over' };
    document.getElementById('where').textContent = NAMES[S.section] || '';
    function link(ic, text, href, current) {
      var a = el('a', { class: 'nv', href: href, 'aria-current': current ? 'page' : null }); a.appendChild(icon(ic)); a.appendChild(el('span', { text: text })); return a;
    }
    nav.appendChild(el('div', { class: 'grp', text: 'COACHING' }));
    nav.appendChild(link('today', 'Today', DASH + '#/today'));
    nav.appendChild(link('clients', 'Clients', DASH + '#/clients'));
    nav.appendChild(link('checkins', 'Check-ins', DASH + '#/check-ins'));
    nav.appendChild(link('activity', 'Activity', DASH + '#/activity'));
    nav.appendChild(el('div', { class: 'grp', text: 'PLANS' }));
    nav.appendChild(link('new', 'New client', '#new', S.section === 'new'));
    nav.appendChild(link('plans', 'Plans and forms', '#plans', S.section === 'clients'));
    nav.appendChild(link('templates', 'Templates', '#templates', S.section === 'templates'));
    nav.appendChild(link('look', 'Your look', '#look', S.section === 'look'));
    nav.appendChild(link('switch', 'Bring clients over', '#switch', S.section === 'switch'));
    who.appendChild(el('button', { class: 'out', type: 'button', text: 'Sign out', onclick: function () { call('cpLogout').catch(function () {}); signOut(false); } }));
  }
  document.getElementById('menu').addEventListener('click', function () { document.body.classList.toggle('drawer'); });
  document.getElementById('backdrop').addEventListener('click', function () { document.body.classList.remove('drawer'); });
  function signOut(expired) {
    S.session = null; S.coach = null; try { localStorage.removeItem(KEY); localStorage.removeItem('sbo_coach_token'); localStorage.removeItem('cp_coach_v1'); } catch (e) {}
    location.replace(DASH);
