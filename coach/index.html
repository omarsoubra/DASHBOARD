<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Coach</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --ink:#16161a; --mute:#6b6b76; --line:#e4e4e0; --accent:#16161a; --good:#1c7c4a; --warn:#a15c00; --bad:#b3261e; --soft:#f0f0ec; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-text-size-adjust:100%; }
  header { position:sticky; top:0; z-index:5; background:var(--card); border-bottom:1px solid var(--line); padding:12px 16px; display:flex; align-items:center; gap:12px; }
  header .brand { font-weight:700; letter-spacing:.06em; text-transform:uppercase; font-size:14px; }
  header .who { margin-left:auto; color:var(--mute); font-size:14px; }
  main { max-width:860px; margin:0 auto; padding:18px 16px 80px; }
  h1 { font-size:24px; margin:6px 0 14px; line-height:1.2; }
  h2 { font-size:15px; margin:26px 0 10px; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); font-weight:600; }
  h3 { font-size:16px; margin:0 0 6px; }
  p { margin:0 0 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .grow { flex:1 1 auto; min-width:0; }
  .mute { color:var(--mute); } .small { font-size:14px; } .right { text-align:right; }
  button, .btn { font:inherit; font-weight:600; border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:10px; padding:11px 16px; cursor:pointer; min-height:44px; }
  button.ghost { background:transparent; color:var(--ink); border-color:var(--line); }
  button.danger { background:transparent; color:var(--bad); border-color:var(--line); }
  button.link { background:none; border:0; color:var(--ink); text-decoration:underline; padding:6px 0; min-height:0; font-weight:500; }
  button:disabled { opacity:.5; cursor:default; }
  label { display:block; font-size:14px; font-weight:600; margin:0 0 5px; }
  .hint { font-weight:400; color:var(--mute); }
  input, select { font:inherit; width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); min-height:44px; }
  input:focus, select:focus, button:focus-visible { outline:2px solid var(--ink); outline-offset:1px; }
  .grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:14px; }
  .grid .full { grid-column:1 / -1; }
  @media (max-width:560px) { .grid { grid-template-columns:1fr; } }
  .err { color:var(--bad); font-size:14px; margin-top:4px; }
  .banner { border-radius:10px; padding:12px 14px; margin-bottom:12px; font-size:15px; }
  .banner.bad { background:#fdecea; color:#7a1c16; } .banner.good { background:#e8f5ee; color:#14532d; } .banner.info { background:var(--soft); }
  .pill { display:inline-block; font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:3px 9px; border-radius:99px; background:var(--soft); color:var(--mute); white-space:nowrap; }
  .pill.good { background:#e8f5ee; color:var(--good); } .pill.warn { background:#fff3dd; color:var(--warn); } .pill.bad { background:#fdecea; color:var(--bad); }
  .item { display:flex; gap:12px; align-items:center; padding:14px 0; border-top:1px solid var(--line); cursor:pointer; background:none; border-left:0; border-right:0; border-bottom:0; width:100%; text-align:left; color:inherit; border-radius:0; font-weight:400; min-height:0; }
  .item:first-child { border-top:0; }
  .item .name { font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:15px; }
  th, td { text-align:left; padding:8px 6px; border-top:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--mute); font-weight:600; border-top:0; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 12px; }
  .tabs button { background:var(--soft); color:var(--ink); border-color:var(--soft); padding:8px 13px; min-height:38px; font-weight:600; font-size:14px; }
  .tabs button[aria-pressed="true"] { background:var(--accent); color:#fff; border-color:var(--accent); }
  .meal { padding:10px 0; border-top:1px solid var(--line); } .meal:first-child { border-top:0; }
  .linkbox { font-family:ui-monospace, Menlo, monospace; font-size:13px; word-break:break-all; background:var(--soft); border-radius:8px; padding:10px; margin:8px 0; }
  .spin { display:inline-block; width:16px; height:16px; border:2px solid var(--line); border-top-color:var(--ink); border-radius:50%; animation:sp 0.8s linear infinite; vertical-align:-3px; margin-right:8px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation:none; } }
  svg.chart { width:100%; height:120px; display:block; }
  header img.logo { width:30px; height:30px; border-radius:8px; object-fit:cover; }
  header nav { display:flex; gap:4px; margin-left:8px; }
  header nav button { background:none; border:0; color:var(--mute); font-weight:600; padding:8px 10px; min-height:40px; border-radius:8px; }
  header nav button[aria-current="page"] { color:var(--ink); background:var(--soft); }
  button, .btn { color:var(--on-accent, #fff); }
  .tabs button[aria-pressed="true"] { color:var(--on-accent, #fff); }
  .edit { display:grid; gap:8px; }
  .erow { display:grid; grid-template-columns:minmax(0,1fr) 64px 84px 96px 40px; gap:6px; align-items:center; }
  .frow { display:grid; grid-template-columns:minmax(0,1fr) 92px 44px 40px; gap:6px; align-items:center; }
  .erow input, .erow select, .frow input { padding:9px 8px; min-height:42px; }
  .ehead { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--mute); font-weight:600; }
  button.x { background:none; border:1px solid var(--line); color:var(--mute); padding:0; width:40px; min-height:42px; font-size:18px; line-height:1; }
  button.mini { padding:6px 12px; min-height:36px; font-size:14px; background:transparent; color:var(--ink); border-color:var(--line); }
  textarea { font:inherit; width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; min-height:96px; resize:vertical; }
  .bar { position:sticky; bottom:12px; z-index:4; background:var(--ink); color:#fff; border-radius:12px; padding:12px 14px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; box-shadow:0 6px 24px rgba(0,0,0,.18); margin-top:14px; }
  .bar button { background:#fff; color:var(--ink); border-color:#fff; } .bar button.ghost { background:transparent; color:#fff; border-color:rgba(255,255,255,.4); }
  .changed { border-color:var(--warn); }
  .swatches { display:flex; flex-wrap:wrap; gap:10px; } .swatches button { width:44px; height:44px; min-height:44px; padding:0; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 1px var(--line); }
  .swatches button[aria-pressed="true"] { box-shadow:0 0 0 3px var(--ink); }
  .phone { width:250px; border:8px solid #16161a; border-radius:30px; background:#faf9f6; overflow:hidden; margin:0 auto; font-size:13px; }
  .phone .top { display:flex; align-items:center; gap:8px; padding:12px; background:#fff; border-bottom:1px solid #e8e3db; font-weight:700; letter-spacing:.05em; text-transform:uppercase; font-size:12px; }
  .phone .top img { width:24px; height:24px; border-radius:6px; }
  .phone .body { padding:12px; display:grid; gap:10px; }
  .phone .pc { background:#fff; border:1px solid #e8e3db; border-radius:12px; padding:10px; }
  .phone .pb { border-radius:99px; padding:9px 12px; text-align:center; font-weight:700; color:#fff; }
  .phone .bar2 { height:8px; border-radius:99px; background:#efece6; overflow:hidden; } .phone .bar2 i { display:block; height:100%; width:62%; }
  .two { display:grid; grid-template-columns:minmax(0,1fr) 280px; gap:18px; align-items:start; } @media (max-width:720px) { .two { grid-template-columns:1fr; } .erow { grid-template-columns:minmax(0,1fr) 56px 72px 40px; } .erow .rest { display:none; } }
  .checks { display:flex; flex-wrap:wrap; gap:8px; } .checks label { display:flex; align-items:center; gap:6px; font-weight:400; margin:0; border:1px solid var(--line); border-radius:99px; padding:7px 12px; background:#fff; }
  .checks input { width:auto; min-height:0; }
</style>
</head>
<body>
<header><img class="logo" id="logo" alt="" hidden><span class="brand" id="brand">Coach</span><nav id="nav" aria-label="Sections"></nav><span class="who" id="who"></span></header>
<main id="app" aria-live="polite"></main>
<script>
(function () {
  'use strict';
  var LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  var API = LOCAL ? '/api' : 'https://cwrrxieahrcustjvpqsk.supabase.co/functions/v1/api';
  var KEY = 'cp_session_v1';
  var S = { session: null, coach: null, options: null, timer: null };
  try { S.session = localStorage.getItem(KEY); } catch (e) {}

  // ── tiny DOM helpers: every piece of text goes through textContent ──────
  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    });
    (function add(c) {
      if (c == null || c === false) return;
      if (Array.isArray(c)) { c.forEach(add); return; }
      n.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
    })(kids);
    return n;
  }
  var app = document.getElementById('app');
  function show(nodes) { stopTimer(); app.replaceChildren.apply(app, Array.isArray(nodes) ? nodes.filter(Boolean) : [nodes]); window.scrollTo(0, 0); }
  function stopTimer() { if (S.timer) { clearTimeout(S.timer); S.timer = null; } }
  function banner(kind, text) { return el('div', { class: 'banner ' + kind, role: kind === 'bad' ? 'alert' : 'status', text: text }); }
  function oops(e) {
    if (e && e.message === 'signed_out') return;
    if (window.console) console.error(e);
    show(banner('bad', e instanceof TypeError && /fetch|network|load/i.test(String(e.message)) ? 'Could not reach the server. Check your connection.' : 'Something went wrong on this screen. Reload the page and try again.'));
  }
  function busy(text) { return el('p', { class: 'mute' }, [el('span', { class: 'spin' }), text]); }

  function call(type, body) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ type: type, session: S.session }, body || {})) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.ok === false && j.error === 'unauthorized' && type !== 'cpLogin') { signOut(true); throw new Error('signed_out'); }
        return j;
      });
  }
  var MSG = {
    bad_login: 'That email and password do not match.', locked: 'Too many tries. Wait 15 minutes and try again.', suspended: 'This account is paused. Contact support.',
    link_invalid: 'This setup link has expired or was already used. Ask for a new one.', password_too_short: 'Use at least 10 characters.',
    password_too_weak: 'Choose a stronger password.', password_too_long: 'That password is too long.', bad_form: 'Check the client\'s name: letters only.',
    client_exists: 'You already have a client with this name. Add a last name, or update their plan from their page.',
    client_limit: 'You have reached your client limit. Contact support to raise it.', too_many_open_builds: 'Three plans are already being built. Finish or discard one first.',
    build_in_progress: 'A plan for this client is already being built.', not_ready: 'This plan is not ready to publish yet.', write_failed: 'Could not save. Try again.',
    unknown_client: 'Client not found.', unknown_build: 'Plan not found.'
  };
  function say(j) { return (j && (j.detail || MSG[j.error])) || 'Something went wrong. Try again.'; }
  function when(iso) {
    if (!iso) return 'never';
    var d = Math.floor((Date.now() - Date.parse(iso)) / 86400000);
    return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d < 14 ? d + ' days ago' : new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
  }
  function lum(hex) { var c = [1, 3, 5].map(function (i) { var v = parseInt(hex.substr(i, 2), 16) / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; }
  function applyTheme(accent) {
    var a = /^#[0-9a-f]{6}$/i.test(accent || '') ? accent : '#16161a';
    document.documentElement.style.setProperty('--accent', a);
    document.documentElement.style.setProperty('--on-accent', lum(a) > 0.3 ? '#16161a' : '#ffffff');
  }
  function setHeader(section) {
    document.getElementById('brand').textContent = S.coach ? S.coach.brand : 'Coach';
    document.title = S.coach ? S.coach.brand + ' - Coach' : 'Coach';
    applyTheme(S.coach && S.coach.accent);
    var logo = document.getElementById('logo');
    if (S.coach && S.coach.logo) { logo.src = 'data:image/png;base64,' + S.coach.logo; logo.hidden = false; } else { logo.hidden = true; logo.removeAttribute('src'); }
    var nav = document.getElementById('nav'); nav.replaceChildren();
    var who = document.getElementById('who'); who.replaceChildren();
    if (!S.coach) return;
    if (section) S.section = section;
    [['clients', 'Clients', homeView], ['templates', 'Templates', templatesView], ['look', 'Your look', lookView]].forEach(function (x) {
      nav.appendChild(el('button', { type: 'button', 'aria-current': S.section === x[0] ? 'page' : null, text: x[1], onclick: x[2] }));
    });
    who.appendChild(el('button', { class: 'link', text: 'Sign out', onclick: function () { call('cpLogout').catch(function () {}); signOut(false); } }));
  }
  function signOut(expired) {
    S.session = null; S.coach = null; try { localStorage.removeItem(KEY); } catch (e) {}
    setHeader(); loginView(expired ? 'Please sign in again.' : null);
  }
  function options() {
    if (S.options) return Promise.resolve(S.options);
    return fetch('options.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (o) { S.options = o; return o; });
  }

  // ── sign in / first-time setup ───────────────────────────────────────────
  function field(label, input, hint) {
    var id = 'f_' + Math.random().toString(36).slice(2, 8); input.id = id;
    return el('div', null, [el('label', { for: id }, [label, hint ? el('span', { class: 'hint', text: '  ' + hint }) : null]), input, el('div', { class: 'err', 'data-err': input.name || '' })]);
  }
  function loginView(note) {
    var email = el('input', { type: 'email', name: 'email', autocomplete: 'username', required: true });
    var pw = el('input', { type: 'password', name: 'password', autocomplete: 'current-password', required: true });
    var msg = el('div');
    var btn = el('button', { type: 'submit', text: 'Sign in' });
    var form = el('form', { class: 'card', onsubmit: function (e) {
      e.preventDefault(); btn.disabled = true; msg.replaceChildren();
      call('cpLogin', { email: email.value, password: pw.value }).then(function (j) {
        btn.disabled = false;
        if (!j.ok) { msg.appendChild(banner('bad', say(j))); return; }
        S.session = j.session; S.coach = j.coach; try { localStorage.setItem(KEY, j.session); } catch (e2) {}
        setHeader(); homeView();
      }).catch(function () { btn.disabled = false; msg.appendChild(banner('bad', 'Could not reach the server. Check your connection.')); });
    } }, [msg, field('Email', email), el('div', { style: 'height:12px' }), field('Password', pw), el('div', { style: 'height:16px' }), btn]);
    show([el('h1', { text: 'Sign in' }), note ? banner('info', note) : null, form]);
  }
  function setupView(token) {
    show(busy('Checking your link'));
    call('cpSetupInspect', { token: token }).then(function (j) {
      if (!j.ok) { show([el('h1', { text: 'Set up your account' }), banner('bad', say(j))]); return; }
      var pw = el('input', { type: 'password', name: 'password', autocomplete: 'new-password', minlength: 10, required: true });
      var pw2 = el('input', { type: 'password', name: 'password2', autocomplete: 'new-password', minlength: 10, required: true });
      var msg = el('div'); var btn = el('button', { type: 'submit', text: 'Save password' });
      show([el('h1', { text: 'Welcome, ' + j.name }), el('p', { class: 'mute', text: 'Choose a password for ' + j.email + '. You will use it to sign in from now on.' }),
        el('form', { class: 'card', onsubmit: function (e) {
          e.preventDefault(); msg.replaceChildren();
          if (pw.value !== pw2.value) { msg.appendChild(banner('bad', 'The two passwords do not match.')); return; }
          btn.disabled = true;
          call('cpSetup', { token: token, password: pw.value }).then(function (r) {
            btn.disabled = false;
            if (!r.ok) { msg.appendChild(banner('bad', say(r))); return; }
            history.replaceState(null, '', location.pathname); loginView('Password saved. Sign in to start.');
          });
        } }, [msg, field('New password', pw, 'at least 10 characters'), el('div', { style: 'height:12px' }), field('Type it again', pw2), el('div', { style: 'height:16px' }), btn])]);
    });
  }

  // ── your own saved plans ──────────────────────────────────────────────────
  function templateSaver(buildId, b) {
    var box = el('div', { style: 'margin-bottom:12px' });
    var open = el('button', { type: 'button', class: 'link', text: 'Save this plan as one of my templates' });
    open.addEventListener('click', function () {
      var name = el('input', { type: 'text', maxlength: 60, placeholder: 'For example: 5 day cut, my way', 'aria-label': 'Template name' });
      var meals = el('input', { type: 'checkbox' }); meals.style.width = 'auto'; meals.style.minHeight = '0';
      var hasMeals = !!(b.form.edits && b.form.edits.meals && Object.keys(b.form.edits.meals).length);
      var msg = el('div');
      box.replaceChildren(el('div', { class: 'card' }, [el('h3', { text: 'Save as a template' }),
        el('p', { class: 'mute small', text: 'It keeps the training plan, the food menu, the length and your training changes. No client details are saved. Use it for any new client and their calories are worked out fresh.' }),
        name, hasMeals ? el('label', { style: 'display:flex;gap:8px;align-items:center;font-weight:500;margin-top:10px' }, [meals, 'Also keep my meal changes (amounts stay exactly as they are here)']) : null, msg,
        el('div', { class: 'row', style: 'margin-top:12px' }, [el('button', { type: 'button', text: 'Save template', onclick: function (e) {
          msg.replaceChildren();
          if (!name.value.trim()) { msg.appendChild(banner('bad', 'Give it a name.')); return; }
          e.target.disabled = true;
          call('cpTemplateSave', { buildId: buildId, name: name.value.trim(), includeMeals: meals.checked }).then(function (r) {
            if (!r.ok) { e.target.disabled = false; msg.appendChild(banner('bad', r.error === 'bad_name' ? 'Use plain letters and numbers in the name.' : r.error === 'too_many_templates' ? 'You have the most templates allowed. Delete one first.' : say(r))); return; }
            S.templates = null; box.replaceChildren(banner('good', r.replaced ? 'Template updated.' : 'Saved. You will see it under "Start from" when you add a client.'));
          });
        } }), el('button', { type: 'button', class: 'ghost', text: 'Cancel', onclick: function () { box.replaceChildren(open); } })])]));
      name.focus();
    });
    box.appendChild(open); return box;
  }
  function templates() {
    if (S.templates) return Promise.resolve(S.templates);
    return call('cpTemplates').then(function (j) { S.templates = j.ok ? j.templates : []; return S.templates; });
  }
  function templatesView() {
    setHeader('templates'); show(busy('Loading'));
    S.templates = null;
    Promise.all([templates(), options()]).then(function (r) {
      var list = r[0], O = r[1];
      var nodes = [el('h1', { text: 'My templates' }), el('p', { class: 'mute', text: 'Plans you built your way and saved. Start any new client from one.' })];
      if (!list.length) nodes.push(el('div', { class: 'card' }, [el('p', { text: 'No templates yet.' }), el('p', { class: 'mute', text: 'Build a plan, change it how you like, then tap "Save this plan as one of my templates" on the review screen.' })]));
      else nodes.push(el('div', { class: 'card' }, list.map(function (t) {
        var tr = O.training[t.form.training], mn = O.menus[t.form.menu];
        return el('div', { class: 'meal' }, [el('div', { class: 'row' }, [el('span', { class: 'grow' }, [el('strong', { text: t.name }),
          el('div', { class: 'mute small', text: [(tr ? tr.label : t.form.training), (mn ? mn.label : t.form.menu), t.form.mealsPerDay + ' meals', t.form.weeks + ' weeks'].join(' · ') + (t.trainingEdited ? ' · your training changes' : '') + (t.mealsEdited ? ' · your meal changes' : '') })]),
          el('button', { type: 'button', class: 'mini', text: 'Use', onclick: function () { formView(null, null, null, t); } }),
          el('button', { type: 'button', class: 'danger mini', text: 'Delete', onclick: function () { if (confirm('Delete the template "' + t.name + '"? Plans already made from it are not affected.')) call('cpTemplateDelete', { id: t.id }).then(templatesView); } })])]);
      })));
      show(nodes);
    }).catch(oops);
  }

  // ── your look: brand name, colour, logo ──────────────────────────────────
  var SWATCHES = ['#16161a', '#e8542e', '#d4af37', '#16a34a', '#0d9488', '#2563eb', '#7c3aed', '#db2777', '#dc2626'];
  function resizeLogo(file, bg) {
    return new Promise(function (resolve, reject) {
      if (!/^image\/(png|jpeg|webp)$/.test(file.type) || file.size > 8e6) { reject(new Error('Use a PNG or JPG under 8 MB.')); return; }
      var img = new Image(), url = URL.createObjectURL(file);
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('That file could not be read as an image.')); };
      img.onload = function () {
        var out = {};
        [512, 192, 180, 32].forEach(function (n) {
          var c = document.createElement('canvas'); c.width = c.height = n; var g = c.getContext('2d');
