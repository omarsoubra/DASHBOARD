# ══════════════════════════════════════════════════════════════════════════════
# Deploy the `push` Edge Function (LOCKED IN Push Notifications — minimal proof)
# ══════════════════════════════════════════════════════════════════════════════
# Manual only, same guard as deploy-edge-api.yml: no push trigger, no schedule.
#
# Scope is exactly one function: `supabase functions deploy push`. The `api`
# function is never deployed from here, and `supabase db push` is never run —
# the push migration is applied by hand in the SQL editor.
#
# Server-side access is gated by the PUSH_ALLOWED_CLIENTS secret (proof:
# "_push_canary"). Unset = no client can subscribe or be sent to.

name: Deploy Edge Function (push)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm you intend to ship supabase/functions/push to production'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-edge-push
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: '2.117.0'

jobs:
  deploy:
    name: deploy push
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Refuse unconfirmed runs
        if: ${{ github.event.inputs.confirm != 'DEPLOY' }}
        run: |
          echo "::error::confirm input was '${{ github.event.inputs.confirm }}', expected DEPLOY"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets are present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_ACCESS_TOKEN}" ] || { echo "::error::SUPABASE_ACCESS_TOKEN is not set"; exit 1; }
          [ -n "${SUPABASE_PROJECT_REF}"  ] || { echo "::error::SUPABASE_PROJECT_REF is not set";  exit 1; }

      - name: Verify the function source exists
        run: |
          set -euo pipefail
          for f in index.ts handler.ts webpush.ts schedule.ts; do
            test -f "supabase/functions/push/$f" || { echo "::error::supabase/functions/push/$f is missing"; exit 1; }
          done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install TypeScript (test harness transpiles the real source)
        run: npm install --no-save typescript@5.9.3

      - name: Run the push test suites
        run: |
          set -euo pipefail
          node tests/push_proof.test.js
          node tests/push_v1.test.js

      - name: Install Supabase CLI (pinned)
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Deploy supabase/functions/push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions deploy push \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt

      - name: Post-deploy ping
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          url="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/push?type=ping"
          for i in 1 2 3 4 5; do
            body="$(curl -sS --max-time 20 "$url" || true)"
            echo "attempt $i: $body"
            case "$body" in
              *'"configured":true'*) echo "ping ok, VAPID configured"; exit 0 ;;
              *'"configured":false'*) echo "::warning::push is live but VAPID secrets are not set yet (fails closed)"; exit 0 ;;
            esac
            sleep 5
          done
          echo "::error::push did not answer ping after deploy"
          exit 1
