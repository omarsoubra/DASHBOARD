# ══════════════════════════════════════════════════════════════════════════════
# Deploy the `api` Edge Function
# ══════════════════════════════════════════════════════════════════════════════
# Manual only. There is no push trigger and no schedule: a deploy happens when
# Omar clicks "Run workflow", never as a side effect of a commit.
#
# Scope is deliberately one function. `supabase functions deploy api` names the
# function explicitly, so no other function in the project is touched, and
# `supabase db push` is never run — migrations stay a separate, human decision.
#
# The job fails hard. Every step is checked, the CLI version is pinned, and the
# post-deploy ping must answer before the run is allowed to go green.

name: Deploy Edge Function (api)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm you intend to ship supabase/functions/api to production'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-edge-api
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: '2.117.0'

jobs:
  deploy:
    name: deploy api
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Refuse unconfirmed runs
        if: ${{ github.event.inputs.confirm != 'DEPLOY' }}
        run: |
          echo "::error::confirm input was '${{ github.event.inputs.confirm }}', expected DEPLOY"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets are present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_ACCESS_TOKEN}" ] || { echo "::error::SUPABASE_ACCESS_TOKEN is not set"; exit 1; }
          [ -n "${SUPABASE_PROJECT_REF}"  ] || { echo "::error::SUPABASE_PROJECT_REF is not set";  exit 1; }

      - name: Verify the function source exists
        run: |
          set -euo pipefail
          test -f supabase/functions/api/index.ts || { echo "::error::supabase/functions/api/index.ts is missing"; exit 1; }
          echo "source bytes: $(wc -c < supabase/functions/api/index.ts)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install TypeScript (test harnesses transpile the real source)
        run: npm install --no-save typescript@5.9.3

      - name: Run the Edge Function test suites
        run: |
          set -euo pipefail
          for t in tests/entitlements.test.js \
                   tests/program_v3.test.js \
                   tests/provisioning.test.js \
                   tests/write_enforcement.test.js; do
            echo "───── $t"
            node "$t"
          done

      - name: Install Supabase CLI (pinned)
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Show CLI version
        run: supabase --version

      - name: Deploy supabase/functions/api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions deploy api \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt

      - name: Post-deploy ping
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          url="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/api?type=ping"
          for i in 1 2 3 4 5; do
            body="$(curl -sS --max-time 20 "$url" || true)"
            echo "attempt $i: $body"
            case "$body" in
              *'"ok":true'*) echo "ping ok"; exit 0 ;;
            esac
            sleep 5
          done
          echo "::error::api did not answer ping with ok:true after deploy"
          exit 1
